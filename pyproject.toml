[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oql"
version = "0.1.2"
description = "OQL CLI — command line interface for OqlOS"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "click>=8.5.1",
    "rich>=13.9.4",
    "httpx>=0.27.2",
    "oqlos>=0.1.27",
    "goal>=2.1.284",
    "costs>=0.1.53",
    "testql>=1.2.63",
]

[project.scripts]
oqlctl = "oql.cli:main"

[project.optional-dependencies]
dev = ["pytest",
    "goal>=2.1.284",
    "costs>=0.1.53",
]

[tool.setuptools.packages.find]
include = ["oql*"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.wellmanifest]
standard = "0.20.165"
revision = "d757476c2df0e8d100ad257b2242dd9bb80c12d1"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
